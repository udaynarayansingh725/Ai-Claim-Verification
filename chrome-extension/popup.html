<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VerifyEngine Extension</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">
    <h3>🔍 VerifyEngine Quick Check</h3>
  </div>
  <div class="content">
    <label>Server Endpoint:</label>
    <input type="text" id="api-url" value="https://ai-claim-verification.onrender.com" />
    
    <label>Claim / Text to Analyze:</label>
    <textarea id="check-text" rows="4" placeholder="Highlight text on webpage or type claim here..."></textarea>
    
    <div class="actions">
      <button id="btn-claim" class="btn">Verify Claim</button>
      <button id="btn-text" class="btn btn-sec">Detect AI Text</button>
    </div>
    
    <div id="result" class="result"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
